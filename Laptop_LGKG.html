nav{grid-template-columns:repeat(5,1fr)}nav button{font-size:.78rem}
header{display:flex;justify-content:space-between;align-items:center}header button{all:unset;color:var(--mut);padding:10px;cursor:pointer;font-size:.9rem}

<script>var LGPro = (function(){
const clone=x=>JSON.parse(JSON.stringify(x));const n=x=>Number.isFinite(Number(x))?Number(x):0;const money=x=>Math.round(n(x));const active=x=>!x.voidedAt;const service=t=>t.documentType==='service'||(t.documentType!=='sale'&&(Object.hasOwn(t,'partsRevenue')||/Từ phiếu/.test(t.note||'')));const total=t=>money(n(t.amount)+n(t.partsRevenue));const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
function init(d){d=clone(d||{});for(const k of ['staffs','inventory','customers','suppliers','creditors','transactions','serviceOrders','importReceipts','cashflow','recycleBin','activityLogs'])d[k]=Array.isArray(d[k])?d[k].filter(Boolean):Object.values(d[k]||{});d.storeInfo??={};d.storeInfo.financeExpenses??=[];d.storeInfo.financeJournal??=[];return d;}
function account(a,amount){assert(!amount||['cash','bank'].includes(a),'Chọn tài khoản Tiền mặt hoặc Ngân hàng.');return a||'unknown';}
function amount(x,label='Số tiền'){assert(Number.isSafeInteger(x)&&x>=0,label+' phải là số nguyên không âm (đồng).');return x;}
function audit(d,env,action,detail){d.activityLogs.push({id:env.id('LOG'),time:env.date+' '+env.time,staff:env.user,action,detail});d.storeInfo.financeJournal.push({id:env.id('AUD'),date:env.date,time:env.time,staffId:env.user,action,detail});}
function lines(d,items,mode,prior=[]){assert(items.length>0,'Chưa có mặt hàng.');const seen=new Set();return items.map(i=>{assert(!seen.has(i.id),'Trùng mã hàng trong giỏ: '+i.id);seen.add(i.id);const p=d.inventory.find(p=>p.id===i.id);assert(p,'Mặt hàng không còn trong kho: '+i.id);assert(d.inventory.filter(x=>x.id===i.id).length===1,'Mã hàng bị trùng, cần tách mã trước: '+i.id);assert(Number.isSafeInteger(i.qty)&&i.qty>0,'Số lượng phải là số nguyên lớn hơn 0.');if(p.serial&&mode==='import')assert(n(p.stock)+i.qty<=1,'Máy theo serial đã tồn tại trong kho.');assert(n(p.stock)>=0,'Kho đang âm. Cần kiểm kê và điều chỉnh trước: '+p.name);const price=amount(i.price??0,'Giá bán');assert(mode==='import'||p.cost!==undefined&&p.cost!==null&&Number.isFinite(Number(p.cost)),'Mặt hàng thiếu giá vốn; quản trị cần đối chiếu trước: '+p.name);let cost=mode==='import'?amount(i.cost,'Giá nhập'):n(p.cost);assert(Number.isFinite(cost)&&cost>=0,'Giá vốn không hợp lệ.');const reserved=prior.find(x=>x.id===i.id);assert(!reserved||reserved.cost!==undefined&&reserved.cost!==null&&Number.isFinite(Number(reserved.cost)),'Phiếu sửa cũ thiếu giá vốn linh kiện; cần đối chiếu trước: '+p.name);assert(mode==='import'||i.qty<=n(p.stock)+n(reserved?.qty),'Không đủ tồn kho: '+p.name);if(reserved&&i.qty<=reserved.qty)cost=n(reserved.cost);return{id:p.id,name:p.name,qty:i.qty,price,cost,note:String(i.note||'')};});}
function take(d,items){for(const i of items){const p=d.inventory.find(p=>p.id===i.id);p.stock=n(p.stock)-i.qty;}}
function put(d,items){for(const i of items){const p=d.inventory.find(p=>p.id===i.id);assert(p,'Không thể hoàn kho vì thiếu mã hàng '+i.id);const q=n(p.stock);assert(q>=0,'Kho âm, cần đối chiếu trước khi hoàn hàng.');p.cost=money((q*n(p.cost)+i.qty*n(i.cost))/(q+i.qty));p.stock=q+i.qty;}}
function outstanding(d,to='9999-12-31'){const invoices=d.transactions.filter(t=>active(t)&&t.type==='debt'&&t.date<=to).sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''))||a.id.localeCompare(b.id));const map=Object.fromEntries(invoices.map(t=>[t.id,total(t)]));const generic=[];for(const p of d.transactions.filter(t=>active(t)&&t.type==='pay'&&t.date<=to)){if(p.allocations?.length){for(const a of p.allocations){if(map[a.invoiceId]!==undefined)map[a.invoiceId]-=n(a.amount);}}else {const token=(p.details||'').match(/(?:HĐ|HD)\s+([^\s()]+)/)?.[1];const linked=p.originalTxId||(invoices.some(t=>t.id===token&&t.customerId===p.customerId)?token:null);if(linked&&map[linked]!==undefined)map[linked]-=n(p.amount);else generic.push(p);}}
for(const p of generic){let remain=n(p.amount);for(const t of invoices.filter(t=>t.customerId===p.customerId)){const paid=Math.min(Math.max(0,map[t.id]),remain);map[t.id]-=paid;remain-=paid;}}
for(const r of d.transactions.filter(t=>active(t)&&t.type==='refund'&&t.date<=to)){if(map[r.originalTxId]!==undefined)map[r.originalTxId]+=n(r.debtAdjustment);}return map;}
function receipt(d,p,env){amount(p.paid);assert(p.paid>0,'Số tiền thu phải lớn hơn 0.');assert(d.customers.some(c=>c.id===p.customerId),'Chọn khách hàng hợp lệ.');account(p.account,p.paid);const open=outstanding(d,env.date);const inv=d.transactions.filter(t=>active(t)&&t.type==='debt'&&t.date<=env.date&&t.customerId===p.customerId&&n(open[t.id])>0&&(!p.invoiceId||t.id===p.invoiceId)).sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''))||a.id.localeCompare(b.id));const due=inv.reduce((s,t)=>s+open[t.id],0);assert(p.paid<=due,'Tiền thu vượt số nợ còn lại ('+money(due).toLocaleString('vi-VN')+' đ).');let remain=p.paid;const allocations=[];for(const t of inv){const a=Math.min(open[t.id],remain);if(a>0)allocations.push({invoiceId:t.id,amount:a});remain-=a;}
const rec={id:env.id('PT'),date:env.date,time:env.time,type:'pay',customerId:p.customerId,amount:p.paid,allocations,paymentAccount:p.account,details:p.note||'Thu công nợ khách hàng',staffId:env.user,engineVersion:3};d.transactions.push(rec);return rec;}
function sale(d,p,env){assert(!p.editId,'Hóa đơn đã chốt không sửa đè. Dùng Trả/hủy toàn bộ, rồi lập hóa đơn thay thế để giữ dấu vết.');const items=lines(d,p.items,'sale');const gross=money(items.reduce((s,i)=>s+i.qty*i.price,0));amount(p.discount);assert(p.discount<=gross,'Giảm giá vượt tổng tiền hàng.');const net=gross-p.discount;amount(p.paid);assert(p.paid<=net,'Số tiền thực thu sau trả lại tiền thừa không được vượt tiền hàng.');if(p.splitTender){amount(p.splitTender.cash);amount(p.splitTender.bank);assert(p.splitTender.cash>0&&p.splitTender.bank>0&&p.splitTender.cash+p.splitTender.bank===p.paid,'Kiểm tra tiền mặt và phần chuyển khoản.');}
account(p.account,p.paid);assert(p.paid===net||d.customers.some(c=>c.id===p.customerId),'Bán nợ phải chọn khách hàng.');const tx={id:env.id('TX'),date:env.date,time:env.time,type:p.paid===net?'cash':'debt',documentType:'sale',customerId:p.customerId||'',amount:net,discount:p.discount,totalCost:money(items.reduce((s,i)=>s+i.qty*i.cost,0)),itemsRaw:items,details:items.map(i=>i.name+' (x'+i.qty+')').join(', '),note:p.note||'',staffId:env.user,paymentAccount:p.account||'unknown',engineVersion:3};d.transactions.push(tx);take(d,items);if(p.paid>0&&p.paid<net)receipt(d,{customerId:p.customerId,invoiceId:tx.id,paid:p.paid,account:p.account,note:'Trả trước cho HĐ '+tx.id},env);if(p.splitTender){const payment=d.transactions[d.transactions.length-1];payment.splitTender=clone(p.splitTender);payment.paymentAccount='mixed';}
audit(d,env,'Bán hàng',tx.id);return tx;}
function purchase(d,p,env){assert(d.suppliers.some(s=>s.id===p.supId),'Chọn nhà cung cấp hợp lệ.');const items=lines(d,p.items,'import');const sum=money(items.reduce((s,i)=>s+i.qty*i.cost,0));amount(p.paid);assert(p.paid<=sum,'Tiền trả NCC không được vượt giá trị phiếu nhập.');account(p.account,p.paid);const rec={id:env.id('PN'),date:env.date,time:env.time,supId:p.supId,total:sum,paid:p.paid,items,paymentAccount:p.account||'unknown',staffId:env.user,engineVersion:3};for(const i of items){const q=d.inventory.find(x=>x.id===i.id);const old=n(q.stock);q.cost=money((old*n(q.cost)+i.qty*i.cost)/(old+i.qty));q.stock=old+i.qty;}d.importReceipts.push(rec);if(p.paid)d.cashflow.push({id:env.id('CF'),date:env.date,time:env.time,type:'chi_ncc',amount:p.paid,reason:'Thanh toán phiếu nhập '+rec.id,supId:p.supId,importId:rec.id,paymentAccount:p.account,staffId:env.user,engineVersion:3});audit(d,env,'Nhập hàng bình quân',rec.id);return rec;}
function repair(d,p,env){const o=d.serviceOrders.find(o=>o.id===p.serviceId&&active(o));assert(o,'Không tìm thấy phiếu sửa.');assert(!/Đã trả|Đã giao|Hủy/.test(o.status||''),'Phiếu đã hoàn tất, không được bàn giao lần nữa.');amount(p.labor);const old=o.isDeducted?(o.partsUsed||[]):[];const items=p.items.length?lines(d,p.items,'sale',old):[];for(const i of items){const reserved=old.find(x=>x.id===i.id);const q=Math.min(i.qty,n(reserved?.qty));const extra=i.qty-q;const inv=d.inventory.find(x=>x.id===i.id);i.cost=money((q*n(reserved?.cost)+extra*n(inv.cost))/i.qty);}for(const prev of old){const next=items.find(x=>x.id===prev.id);const release=prev.qty-n(next?.qty);if(release>0)put(d,[{...prev,qty:release}]);}for(const i of items){const extra=i.qty-n(old.find(x=>x.id===i.id)?.qty);if(extra>0)take(d,[{...i,qty:extra}]);}o.partsUsed=items;o.laborCost=p.labor;o.quote=p.labor+money(items.reduce((s,i)=>s+i.qty*i.price,0));o.isDeducted=true;
if(!p.finish){o.status='Chờ khách lấy';audit(d,env,'Lưu máy chờ trả',o.id);return o;}
const held=LGBooks.depositBalance(d,o.id);
assert(held<=o.quote,'Tiền cọc cao hơn giá bàn giao. Hoàn phần cọc dư trước khi giao máy.');
const tendered=p.paid;account(p.account,tendered);
p={...p,paid:tendered+held,account:tendered?p.account:'cash'};
amount(p.paid);assert(p.paid<=o.quote,'Số tiền thực thu không được vượt phí sửa.');account(p.account,p.paid);assert(p.paid===o.quote||d.customers.some(c=>c.id===o.customerId),'Phiếu sửa bán nợ phải có khách hàng hợp lệ.');const tx={id:env.id('TX'),date:env.date,time:env.time,type:p.paid===o.quote?'cash':'debt',documentType:'service',serviceOrderId:o.id,customerId:o.customerId,amount:p.labor,partsRevenue:o.quote-p.labor,totalCost:money(items.reduce((s,i)=>s+i.qty*i.cost,0)),itemsRaw:items,details:'Sửa máy: '+o.model+' (Lỗi: '+o.condition+')',note:'Từ phiếu nhận máy: '+o.id,paymentAccount:p.account||'unknown',staffId:env.user,engineVersion:3};d.transactions.push(tx);if(p.paid>0&&p.paid<o.quote)receipt(d,{customerId:o.customerId,invoiceId:tx.id,paid:p.paid,account:p.account,note:'Trả trước cho HĐ '+tx.id},env);if(held){tx.depositApplied=held;

 function printSupplier(s,m){const rows=m.rows.map(r=>'<tr><td>'+E(vnDate(r.date))+'<br>'+E(short(r.id))+'</td><td><b>'+E(r.title)+'</b><br>'+E(r.note)+r.items.map(i=>'<div>'+E(i.name||D.inventory.find(x=>x.id===i.id)?.name||i.id)+' · SL '+i.qty+' × '+M(i.cost)+'</div>').join('')+'</td><td>'+M(r.amount)+'</td><td>'+M(r.balance)+'</td></tr>').join('');panel('In bảng kê nhà cung cấp',button('supplier-print-now','In / Lưu PDF')+'<iframe id="supplier-frame" title="Bảng kê nhà cung cấp" style="width:100%;height:65vh;border:1px solid #ddd"></iframe>');const frame=by('supplier-frame');let ready=false;frame.onload=()=>ready=true;frame.srcdoc='<!doctype html><html lang="vi"><meta charset="utf-8"><style>body{font:14px Arial;color:#14202b;padding:18px}h1{font-size:22px;text-align:center}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:8px}td:nth-child(3),td:nth-child(4){text-align:right;white-space:nowrap}th{background:#eef2f6}@page{size:A4 portrait;margin:12mm}tr{break-inside:avoid}</style><h2>'+E(D.storeInfo.name||'LƯƠNG GIA KG')+'</h2><p>'+E(D.storeInfo.address||'')+' · '+E(D.storeInfo.phone||'')+'</p><h1>BẢNG KÊ CÔNG NỢ NHÀ CUNG CẤP</h1><p>Nhà cung cấp: '+E(s.name)+' · Đến ngày '+vnDate(today())+'</p><table><thead><tr><th>Ngày / phiếu</th><th>Nội dung</th><th>Phát sinh</th><th>Dư nợ</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><th colspan="3">CÒN NỢ</th><th>'+M(m.balance)+'</th></tr></tfoot></table><p>Số âm: trả tiền / giảm nợ. Số dư chuyển sang không có chi tiết món hàng sẽ được ghi rõ. Đơn vị: VNĐ.</p></html>';by('supplier-print-now').onclick=()=>{if(!ready)return toast('Bảng kê đang tải.');frame.contentWindow.focus();frame.contentWindow.print();};}
