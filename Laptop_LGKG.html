<script>
    // Đóng Modal khi bấm ra ngoài
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('mousedown', function(e) { if(e.target === this) this.style.display = 'none'; });
    });

    const firebaseConfig = { databaseURL: "https://luonggiakg-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let staffs=[], inventory=[], customers=[], suppliers=[], transactions=[], serviceOrders=[], importReceipts=[], cashflow=[], recycleBin=[], activityLogs=[];
    let storeInfo = { name: 'LƯƠNG GIA KG', address: '37 ấp 5, An Biên, Kiên Giang', phone: '0941.113.411', logoUrl: '' };
    
    let activeUser = null, editingTxId = null, editingSrvId = null;
    let editingTxDate = null, editingTxTime = null; 
    
    let posCart = [], impCart = [], hoCart = [];

    // HÀM NHẬN DIỆN ÔNG CHỦ MẠNH NHẤT (BẤT CHẤP CÓ DẤU HAY KHÔNG DẤU)
    function isBoss() { 
        if(activeUser === 'ADMIN') return true; 
        let s = staffs.find(x => x.id === activeUser); 
        if(!s) return false;
        let n = s.name || ''; let i = s.id || '';
        // Cạo sạch dấu tiếng Việt để kiểm tra, đảm bảo "luong minh tri" hay "Lương Minh Trí" đều tính là Sếp
        let checkStr = (n + " " + i).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return checkStr.includes('tri') || checkStr.includes('admin') || checkStr.includes('chu') || checkStr.includes('boss'); 
    }

    // HÀM ÉP CẬP NHẬT QUYỀN GIAO DIỆN
    function updatePermissions() {
        if(!activeUser) return;
        
        // Phân quyền Ẩn/Hiện thẻ
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = isBoss() ? 'flex' : 'none');
        document.querySelectorAll('th.admin-only, td.admin-only').forEach(el => el.style.display = isBoss() ? 'table-cell' : 'none');
        document.querySelectorAll('.staff-only').forEach(el => el.style.display = !isBoss() ? 'flex' : 'none');
        
        // Cài đặt ô chọn Sổ quỹ
        let cbType = document.getElementById('cb-type');
        if(cbType) {
            let currentVal = cbType.value; 
            cbType.options.length = 0; 
            cbType.add(new Option('🔴 Chi Tiền (Điện, nước, nhập hàng...)', 'chi'));
            cbType.add(new Option('🟢 Thu Khác (Bán phế liệu, đồng nát...)', 'thu'));
            
            if(isBoss()) {
                cbType.add(new Option('🔵 Nhận Tiền Vay / Mượn', 'vay_muon'));
                cbType.add(new Option('🟣 Trả Nợ Vay (Chọn chủ nợ để trả)', 'tra_no'));
            }
            
            let exists = Array.from(cbType.options).some(o => o.value === currentVal);
            if(exists) cbType.value = currentVal;
            
            toggleCreditorField(); 
        }
    }

    // HÀM PHỤ TRỢ
    function getVal(id) { let v = document.getElementById(id).value.replace(/[^0-9]/g, ''); return v ? parseInt(v, 10) : 0; }
    function setVal(id, val) { document.getElementById(id).value = val.toLocaleString('vi-VN'); }
    function setTxt(id, val) { let el = document.getElementById(id); if(el) el.innerText = typeof val==='number' ? val.toLocaleString('vi-VN') : val; }
    function formatNum(el) { let v = el.value.replace(/[^0-9]/g, ''); if(v) el.value = parseInt(v, 10).toLocaleString('vi-VN'); else el.value = ''; }
    function getToday() { let d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]; }
    function getTime() { let d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
    function formatD(str) { if(!str)return''; let d=new Date(str); return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`; }
    function genId(prefix) { return prefix + '_' + Date.now().toString().slice(-5); }

    function logAction(action, detail) { 
        let s = staffs.find(x=>x.id===activeUser); let sName = s ? s.name : 'Hệ thống';
        activityLogs.push({ id: 'LOG_'+Date.now(), time: formatD(getToday()) + ' ' + getTime(), staff: sName, action: action, detail: detail }); 
        if(activityLogs.length > 200) activityLogs.shift(); 
    }
    
    function deleteItemToBin(id, type, arrayRef, labelGen) { 
        uiConfirm('⚠️ CHẮC CHẮN MUỐN XÓA?', () => { 
            let index = arrayRef.findIndex(x => String(x.id) === String(id)); 
            if(index > -1) { 
                let item = arrayRef[index]; 
                recycleBin.push({ id: 'RB_'+Date.now(), type: type, label: labelGen(item), data: item, deletedAt: formatD(getToday()) + ' ' + getTime() }); 
                logAction(`Xóa ${type}`, labelGen(item)); 
                arrayRef.splice(index, 1); pushDB(); renderData(); 
            } 
        }); 
    }
    
    function restoreBinItem(rbId) { 
        uiConfirm('♻️ Phục hồi lại dữ liệu này?', () => { 
            let index = recycleBin.findIndex(x => x.id === rbId); 
            if(index > -1) { 
                let rb = recycleBin[index]; 
                if(rb.type === 'Sản Phẩm') inventory.push(rb.data); 
                else if(rb.type === 'Sổ Quỹ') cashflow.push(rb.data); 
                else if(rb.type === 'Phiếu Nhận Máy') serviceOrders.push(rb.data);
                else if(rb.type === 'Giao Dịch') transactions.push(rb.data);
                logAction(`Khôi phục thùng rác`, rb.label); 
                recycleBin.splice(index, 1); pushDB(); renderData(); uiAlert('✅ Khôi phục thành công!'); 
            } 
        }); 
    }

    function openSidebar() { document.getElementById('sidebar').classList.add('show'); document.getElementById('sidebar-overlay').classList.add('show'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('show'); document.getElementById('sidebar-overlay').classList.remove('show'); }
    function openModal(id) { document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    
    let confirmCb = null; 
    function uiConfirm(msg, cb) { document.getElementById('confirm-msg').innerText=msg; confirmCb=cb; openModal('uiConfirm'); }
    function closeConfirm(isYes) { closeModal('uiConfirm'); if(isYes && confirmCb) confirmCb(); confirmCb=null; }
    function uiAlert(msg) { document.getElementById('alert-msg').innerHTML=msg; openModal('uiAlert'); }

    function switchTab(tab) {
        if(!activeUser) return;
        if(!isBoss() && ['dashboard', 'reports', 'partners', 'admin'].includes(tab)) return uiAlert("Bạn không có quyền!");
        
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        
        let navs = document.querySelectorAll('.nav-item');
        for(let n of navs) if(n.innerText.toLowerCase().includes(tab.substring(0,3))) n.classList.add('active');
        closeSidebar(); 
        
        let titles = {pos:'BÁN HÀNG', service:'TIẾP NHẬN & BÀN GIAO', inventory:'KHO HÀNG', partners:'ĐỐI TÁC', cashbook:'SỔ QUỸ', reports:'BÁO CÁO', history:'LỊCH SỬ', admin:'HỆ THỐNG', dashboard:'TỔNG QUAN'};
        setTxt('top-title', titles[tab] || 'LƯƠNG GIA KG');
        if(tab === 'pos' && editingTxId) setTxt('top-title', `ĐANG SỬA BILL: ${editingTxId} (Bấm Hủy để thoát)`);
        
        if(tab === 'cashbook') {
            let wrap = document.getElementById('cb-content-wrapper');
            if(!isBoss()) {
                wrap.innerHTML = `
                    <details class="card" style="border-top:4px solid var(--success); cursor:pointer;">
                        <summary style="font-weight:bold; font-size:1.1rem; color:var(--success);">🟢 XEM PHIẾU THU TRONG NGÀY (Bấm mở)</summary>
                        <div class="table-wrap" style="margin-top:15px; cursor:default;"><table><thead><tr><th>Giờ</th><th>Diễn giải</th><th style="text-align:right;">Tiền</th><th>Xóa</th></tr></thead><tbody id="cb-tbl-in"></tbody></table></div>
                    </details>
                    <details class="card" style="border-top:4px solid var(--danger); cursor:pointer;">
                        <summary style="font-weight:bold; font-size:1.1rem; color:var(--danger);">🔴 XEM PHIẾU CHI TRONG NGÀY (Bấm mở)</summary>
                        <div class="table-wrap" style="margin-top:15px; cursor:default;"><table><thead><tr><th>Giờ</th><th>Diễn giải</th><th style="text-align:right;">Tiền</th><th>Xóa</th></tr></thead><tbody id="cb-tbl-out"></tbody></table></div>
                    </details>
                `;
            } else {
                wrap.innerHTML = `
                    <div class="row">
                        <div class="col card" style="padding:15px; border-top:4px solid var(--success);">
                            <h4 style="text-align:center; color:var(--success); margin-top:0;">🟢 PHIẾU THU</h4>
                            <div class="table-wrap"><table><thead><tr><th>Ngày-Giờ</th><th>Nhân Viên</th><th>Diễn giải</th><th style="text-align:right;">Tiền</th><th>Thao tác</th></tr></thead><tbody id="cb-tbl-in"></tbody></table></div>
                        </div>
                        <div class="col card" style="padding:15px; border-top:4px solid var(--danger);">
                            <h4 style="text-align:center; color:var(--danger); margin-top:0;">🔴 PHIẾU CHI</h4>
                            <div class="table-wrap"><table><thead><tr><th>Ngày-Giờ</th><th>Nhân Viên</th><th>Diễn giải</th><th style="text-align:right;">Tiền</th><th>Thao tác</th></tr></thead><tbody id="cb-tbl-out"></tbody></table></div>
                        </div>
                    </div>
                `;
            }
        }
        renderData();
    }

    function filterTable(tbodyId, filterVal) {
        let f = filterVal.toLowerCase(); let rows = document.getElementById(tbodyId).getElementsByTagName('tr');
        for(let r of rows) r.style.display = r.innerText.toLowerCase().includes(f) ? '' : 'none';
    }

    function closeAllAutocomplete() { document.querySelectorAll('.autocomplete-items').forEach(el => el.style.display='none'); }
    function handleSearch(prefix, dataArr, clickCb) {
        let listEl = document.getElementById(prefix + '-autocomplete'); listEl.innerHTML=''; listEl.style.display='none';
        let val = document.getElementById(prefix + '-input').value.toLowerCase();
        if(!val) return;
        let matches = dataArr.filter(i => (i.name||'').toLowerCase().includes(val) || (i.phone||'').includes(val) || (i.id||'').toLowerCase().includes(val)).slice(0, 8);
        if(matches.length > 0) {
            matches.forEach(item => {
                let div = document.createElement('div');
                div.innerHTML = `<b>${item.name}</b> ${item.phone ? ' - '+item.phone : ''} ${item.price ? ' - <span style="color:var(--danger)">'+item.price.toLocaleString()+'đ</span> (Tồn: '+item.stock+')' : ''}`;
                div.onclick = (e) => { e.stopPropagation(); clickCb(item); listEl.style.display='none'; };
                listEl.appendChild(div);
            });
            listEl.style.display='block';
        }
    }

    function handleHistAutocomplete() {
        let val = document.getElementById('hist-search-input').value.toLowerCase();
        let listEl = document.getElementById('hist-search-autocomplete');
        document.getElementById('hist-exact-cusid').value = ''; 
        
        let matches = customers.filter(c => c.name.toLowerCase().includes(val) || (c.phone||'').includes(val)).slice(0, 5);
        if(matches.length > 0 && val) {
            listEl.innerHTML = matches.map(m => {
                let div = document.createElement('div');
                div.innerHTML = `🎯 <b>${m.name}</b> - ${m.phone||''}`;
                div.onclick = (e) => { 
                    e.stopPropagation(); 
                    document.getElementById('hist-search-input').value = m.name; 
                    document.getElementById('hist-exact-cusid').value = m.id; 
                    listEl.style.display = 'none'; 
                    renderHistoryTable(); 
                };
                return div.outerHTML;
            }).join('');
            listEl.style.display = 'block';
        } else {
            listEl.style.display = 'none';
        }
        renderHistoryTable(); 
    }

    // FIREBASE
    db.ref('.info/connected').on('value', function(snap) {
        let el = document.getElementById('net-status'); if(!el) return;
        if (snap.val() === true) { el.innerText = '✅ Đã kết nối máy chủ.'; el.style.color = 'var(--success)'; } 
        else { el.innerText = '⏳ Đang dò kết nối...'; el.style.color = 'var(--warning)'; }
    });

    db.ref().on('value', snap => {
        let d = snap.val();
        if (!d) return; 

        let toArr = (obj) => obj ? (Array.isArray(obj) ? obj.filter(x=>x) : Object.values(obj)) : [];
        staffs = toArr(d.staffs); 
        inventory = toArr(d.inventory); customers = toArr(d.customers); suppliers = toArr(d.suppliers);
        transactions = toArr(d.transactions); serviceOrders = toArr(d.serviceOrders); importReceipts = toArr(d.importReceipts); 
        cashflow = toArr(d.cashflow); recycleBin = toArr(d.recycleBin); activityLogs = toArr(d.activityLogs);
        if(d.storeInfo) storeInfo = d.storeInfo;
        
        let lSel = document.getElementById('login-user');
        if(lSel) lSel.innerHTML = staffs.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        
        let saved = localStorage.getItem('lg_user');
        if(saved && !activeUser) { 
            activeUser = saved; 
            document.getElementById('loginOverlay').style.display='none'; 
            initSession(); 
        }
        
        if(activeUser) {
            updatePermissions();
            renderData();
        }
    });
    
    function pushDB() { 
        let rawPayload = { staffs, inventory, customers, suppliers, transactions, serviceOrders, importReceipts, cashflow, recycleBin, activityLogs, storeInfo };
        db.ref().set(JSON.parse(JSON.stringify(rawPayload))).catch(error => { 
            uiAlert(`<span style="color:red; font-size:1.1rem; font-weight:bold;">❌ LỖI MẠNG:</span><br><br>${error.message}`); 
        });
    }

    function doLogin() {
        let u = document.getElementById('login-user').value, p = document.getElementById('login-pass').value;
        if(!u) return uiAlert('Chưa có danh sách nhân viên. Chờ chút...');
        let s = staffs.find(x => x.id === u);
        if(s && (s.pass === p || s.password === p)) { 
            activeUser=u; localStorage.setItem('lg_user',u); 
            document.getElementById('loginOverlay').style.display='none'; 
            initSession(); 
        } else {
            uiAlert('Sai mật khẩu! Vui lòng kiểm tra lại.');
        }
    }
    
    function logout() { activeUser=null; localStorage.removeItem('lg_user'); location.reload(); }
    
    function initSession() {
        let s = staffs.find(x=>x.id===activeUser); 
        setTxt('top-user', s ? s.name : 'Vô danh');
        document.getElementById('dash-date').value = getToday(); 
        document.getElementById('cb-staff-date').value = getToday(); 
        setCbDate('today');
        
        updatePermissions(); 

        switchTab(isBoss() ? 'dashboard' : 'pos');
    }

    /* ---------------- POS - BÁN HÀNG ---------------- */
    function selectPosCus(c) { document.getElementById('pos-cus-input').value = `${c.name} - ${c.phone}`; document.getElementById('pos-cus-id').value = c.id; }
    function clearPosCus() { document.getElementById('pos-cus-input').value = ''; document.getElementById('pos-cus-id').value = ''; }
    function addProdToCart(p) { let ex = posCart.find(i => i.id === p.id); if(ex) ex.qty++; else posCart.push({ id: p.id, name: p.name, price: p.price, cost: p.cost||0, qty: 1 }); document.getElementById('pos-prod-input').value=''; renderPosCart(); }
    function updateCartQty(idx, v) { posCart[idx].qty = parseInt(v)||1; calcPos(); }
    function removeCart(idx) { posCart.splice(idx,1); renderPosCart(); }
    function renderPosCart() { document.getElementById('pos-cart').innerHTML = posCart.map((c,i) => `<li class="cart-item"><div><b style="color:var(--primary);">${c.name}</b></div><div style="display:flex; gap:10px; align-items:center;"><input type="number" value="${c.qty}" style="width:60px; padding:6px; border:1px solid var(--border); border-radius:6px; text-align:center;" onchange="updateCartQty(${i}, this.value)"> x ${c.price.toLocaleString()} đ <button class="btn btn-outline" style="padding:6px; color:var(--danger); border:none;" onclick="removeCart(${i})">✕</button></div></li>`).join('') || '<li style="padding:20px; text-align:center; color:var(--text-muted);">Giỏ hàng trống</li>'; calcPos(); }
    function calcPos() { let sum = posCart.reduce((s,i) => s + (i.price * i.qty), 0); setTxt('pos-sum', sum); let disc = getVal('pos-discount'), fin = sum - disc; if(fin<0) fin=0; setTxt('pos-final', fin); calcPosChange(); }
    function calcPosChange() { let sum = posCart.reduce((s,i) => s + (i.price * i.qty), 0) - getVal('pos-discount'); if(sum<0) sum=0; let paid = getVal('pos-paid'), el = document.getElementById('pos-change-txt'); if(paid > 0 && paid < sum) { el.innerHTML = `Khách nợ lại: ${(sum-paid).toLocaleString()} đ`; } else if (paid > sum) { el.innerHTML = `<span style="color:var(--success);">Tiền thối: ${(paid-sum).toLocaleString()} đ</span>`; } else el.innerHTML = ''; }

    function editFullTransaction(id) { 
        let tx = transactions.find(t=>t.id===id); if(!tx) return; 
        uiConfirm("Bốc hóa đơn ra giỏ để sửa?", () => { 
            posCart = JSON.parse(JSON.stringify(tx.itemsRaw||[])); 
            let c = customers.find(x=>x.id===tx.customerId); 
            if(c) { document.getElementById('pos-cus-input').value = `${c.name} - ${c.phone}`; document.getElementById('pos-cus-id').value = c.id; } 
            document.getElementById('pos-note').value = tx.note||''; 
            
            editingTxId = id; 
            editingTxDate = tx.date;
            editingTxTime = tx.time; 
            
            setTxt('top-title', `ĐANG SỬA BILL: ${id} (Bấm Hủy để thoát)`); 
            switchTab('pos'); renderPosCart(); 
        }); 
    }

    function checkout(paymentType) {
        if(posCart.length===0) return uiAlert('Giỏ hàng trống!');
        let sum = posCart.reduce((s,i) => s + (i.price * i.qty), 0), disc = getVal('pos-discount'), fin = sum - disc; if(fin<0) fin=0;
        let cost = posCart.reduce((s,i) => s + ((i.cost||0) * i.qty), 0), cId = document.getElementById('pos-cus-id').value, paid = 0;
        
        if (paymentType === 'cash') { paid = fin; } 
        else if (paymentType === 'debt') { 
            if(!cId) return uiAlert('Bán nợ vui lòng CHỌN KHÁCH HÀNG!'); 
            paid = getVal('pos-paid'); 
            if (paid >= fin) return uiAlert('Tiền khách đưa >= tổng bill. Hãy chọn TIỀN MẶT!'); 
        }
        
        uiConfirm(`Chốt đơn ${paymentType==='cash'?'TIỀN MẶT':'CÔNG NỢ'}?\n- Tổng: ${fin.toLocaleString()}đ\n- Thu: ${paid.toLocaleString()}đ`, () => {
            
            let finalDate = editingTxId ? editingTxDate : getToday();
            let finalTime = editingTxId ? editingTxTime : getTime();
            
            if(editingTxId) { 
                let oldTx = transactions.find(t=>t.id===editingTxId); 
                if(oldTx && oldTx.itemsRaw) oldTx.itemsRaw.forEach(i => { let inv = inventory.find(x=>x.id===i.id); if(inv) inv.stock += i.qty; }); 
                transactions = transactions.filter(t=>t.id!==editingTxId); 
            }
            
            let tId = editingTxId || genId('TX'), mainType = paid >= fin ? 'cash' : 'debt';
            let det = posCart.map(c=>`${c.name} (x${c.qty})`).join(', ') + (disc>0?` (Bớt ${disc.toLocaleString()}đ)`:'');
            
            transactions.push({ id: tId, customerId: cId, date: finalDate, time: finalTime, type: mainType, amount: fin, totalCost: cost, details: det, itemsRaw: JSON.parse(JSON.stringify(posCart)), staffId: activeUser, note: document.getElementById('pos-note').value.trim() });
            
            if(paid > 0 && paid < fin) {
                transactions.push({ id: genId('PT'), customerId: cId, date: finalDate, time: finalTime, type: 'pay', amount: paid, details: `Trả trước cho HĐ ${tId}`, staffId: activeUser });
            }
            
            posCart.forEach(c => { let inv = inventory.find(x=>x.id===c.id); if(inv) inv.stock -= c.qty; }); 
            pushDB(); 
            posCart=[]; clearPosCus(); document.getElementById('pos-discount').value='0'; document.getElementById('pos-paid').value='0'; document.getElementById('pos-paid').dataset.m=''; document.getElementById('pos-note').value='';
            
            if(editingTxId) { 
                editingTxId = null; editingTxDate = null; editingTxTime = null; 
                setTxt('top-title', 'BÁN HÀNG'); 
                uiAlert('✅ Đã sửa và lưu đè (Vẫn giữ nguyên ngày giờ cũ)!'); 
                switchTab('history'); 
            } else { 
                renderPosCart(); setTimeout(() => uiAlert('✅ Chốt đơn thành công!'), 200); renderData(); 
            }
        });
    }

    /* ---------------- NHẬP KHO ---------------- */
    function selectImpSup(s) { document.getElementById('imp-sup-input').value = `${s.name} - ${s.phone}`; document.getElementById('imp-sup-id').value = s.id; }
    function addProdToImp(p) { let ex = impCart.find(i => i.id === p.id); if(ex) ex.qty++; else impCart.push({ id: p.id, name: p.name, cost: p.cost||0, qty: 1 }); document.getElementById('imp-prod-input').value=''; renderImpCart(); }
    function updateImpQty(idx, v) { impCart[idx].qty = parseInt(v)||1; renderImpCart(); } 
    function updateImpCost(idx, v) { impCart[idx].cost = parseInt(v.replace(/[^0-9]/g, ''))||0; renderImpCart(); } 
    function removeImp(idx) { impCart.splice(idx,1); renderImpCart(); }
    function renderImpCart() { 
        let sum = 0; 
        document.getElementById('imp-cart').innerHTML = impCart.map((c,i) => { sum += c.cost * c.qty; return `<li class="cart-item"><div style="flex:1;"><b style="color:var(--text-main); font-size:0.9rem;">${c.name}</b></div><div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;"><input type="number" value="${c.qty}" style="width:60px; padding:6px; border:1px solid var(--border); border-radius:6px;" onchange="updateImpQty(${i}, this.value)"><input type="text" inputmode="numeric" value="${c.cost.toLocaleString()}" style="width:90px; padding:6px; border:1px solid var(--border); border-radius:6px; text-align:right; font-weight:bold; color:var(--danger);" oninput="formatNum(this)" onchange="updateImpCost(${i}, this.value)"><button class="btn btn-outline" style="padding:6px; color:var(--danger); border:none;" onclick="removeImp(${i})">✕</button></div></li>`; }).join('') || '<li style="padding:20px; text-align:center;">Phiếu trống</li>'; 
        setTxt('imp-total-txt', sum.toLocaleString() + ' đ'); 
    }
    function submitImport() { 
        if(impCart.length===0) return uiAlert("Chưa có hàng!");

    function submitHandover() {

                let mt = paid >= tot ? 'cash' : 'debt', txId = genId('TX');

                if(paid>0 && paid<tot) { transactions.push({ id: genId('PT'), customerId: o.customerId, date: getToday(), time: getTime(), type: 'pay', amount: paid, details: `Trả đợt 1 phiếu sửa ${o.id}`, staffId: activeUser }); }
            } 
            o.quote = tot; o.status = 'Đã trả khách'; pushDB(); closeModal('handoverModal'); document.getElementById('ho-paid').dataset.m=''; renderData(); setTimeout(() => uiAlert('✅ Bàn giao thành công!'), 200);

    function submitCashbook() { 
        let a = getVal('cb-amt'), t = document.getElementById('cb-type').value, r = document.getElementById('cb-reason').value.trim(); 
        let creditor = '';
        
        if (t === 'vay_muon' || t === 'tra_no') {
            let credEl = document.getElementById('cb-creditor-name');
            creditor = credEl ? credEl.value.trim() : '';
            if (!creditor) return uiAlert('❌ Vui lòng nhập hoặc chọn Tên chủ nợ!');
            
            if (!r && t === 'vay_muon') r = `Mượn tiền của ${creditor}`;
            if (!r && t === 'tra_no') r = `Trả nợ vay cho ${creditor}`;
            
            if (t === 'tra_no' && window.tempDebts && a > (window.tempDebts[creditor]||0)) {
                return uiAlert(`❌ Không được trả lố! Bạn chỉ đang nợ ${(window.tempDebts[creditor]||0).toLocaleString()}đ`);
            }
        }
        
        if(a<=0 || !r) return uiAlert('Nhập đủ số tiền và lý do!'); 
        
        uiConfirm("Lưu phiếu vào Sổ Quỹ?", () => { 
            let newFlow = {id: genId('CF'), date: getToday(), time: getTime(), type: t, amount: a, reason: r, staffId: activeUser};
            if(creditor) newFlow.creditor = creditor; 
            
            cashflow.push(newFlow); 
            pushDB(); 
            
            if(t === 'vay_muon' || t === 'tra_no') toggleCreditorField(); // Chạy lại logic xổ chủ nợ
            else { setVal('cb-amt',0); document.getElementById('cb-reason').value=''; }
            
            renderData(); setTimeout(()=>uiAlert('✅ Lưu sổ quỹ thành công!'), 200); 
        }); 
    }

    // ĐÃ FIX 100% LỖI MẤT Ô CHỦ NỢ
    function toggleCreditorField() {
        let cbType = document.getElementById('cb-type');
        if(!cbType) return;
        let t = cbType.value;
        let wrap = document.getElementById('cb-creditor-wrap');
        let inpArea = document.getElementById('cb-creditor-input-area');
        let info = document.getElementById('cb-creditor-debt-info');
        
        if (t === 'vay_muon') {
            wrap.style.display = 'block';
            document.getElementById('cb-creditor-label').innerText = 'Mượn của ai (Tên Chủ nợ / Ngân hàng):';
            inpArea.innerHTML = `<input type="text" id="cb-creditor-name" class="form-control" placeholder="Ví dụ: Anh Ba, Sacombank..." style="border-color:var(--success);">`;
            info.style.display = 'none';
            setVal('cb-amt', 0); document.getElementById('cb-reason').value = '';
        } else if (t === 'tra_no') {
            wrap.style.display = 'block';
            document.getElementById('cb-creditor-label').innerText = 'Chọn chủ nợ để trả:';
            
            let debts = {};
            cashflow.forEach(c => {
                if (c.type === 'vay_muon' && c.creditor) debts[c.creditor] = (debts[c.creditor] || 0) + c.amount;
                else if (c.type === 'tra_no' && c.creditor) debts[c.creditor] = (debts[c.creditor] || 0) - c.amount;
            });
            
            let options = '<option value="" disabled selected>-- Chọn chủ nợ đang thiếu --</option>';
            let hasDebt = false;
            for (let k in debts) {
                if (debts[k] > 0) {
                    options += `<option value="${k}">${k} (Đang thiếu: ${debts[k].toLocaleString()}đ)</option>`;
                    hasDebt = true;
                }
            }
            if(!hasDebt) options = '<option value="" disabled selected>-- Hiện không nợ ai cả! --</option>';
            
            inpArea.innerHTML = `<select id="cb-creditor-name" class="form-control" style="border-color:var(--success); font-weight:bold;" onchange="showCreditorDebt(this.value)">${options}</select>`;
            info.style.display = 'none';
            window.tempDebts = debts;
            setVal('cb-amt', 0); document.getElementById('cb-reason').value = '';
        } else {
            if(wrap) wrap.style.display = 'none';
        }
    }
    
    function showCreditorDebt(name) {
        let info = document.getElementById('cb-creditor-debt-info');
        if(name && window.tempDebts && window.tempDebts[name]) {
            info.innerText = `⚠️ Còn nợ: ${window.tempDebts[name].toLocaleString()} đ`;
            info.style.display = 'block';
            setVal('cb-amt', window.tempDebts[name]); 
        } else {
            info.style.display = 'none';
            setVal('cb-amt', 0);
        }
    }

    /* ---------------- DASHBOARD & BÁO CÁO ---------------- */
    function renderDashboard() {
        let target = document.getElementById('dash-date').value;
        let sales = 0, cashSales = 0, debtSales = 0, bills = 0, repairs = 0, expenses = 0;
        
        transactions.forEach(t => {
            if(t.date === target) {
                let amt = t.amount + (t.partsRevenue||0);
                if(t.type === 'cash') { cashSales += amt; sales += amt; bills++; }
                else if(t.type === 'debt') { debtSales += amt; sales += amt; bills++; }
                else if(t.type === 'pay') { bills++; }
            }
        });
        serviceOrders.forEach(o => { if(!o.status.includes('Đã trả') && !o.status.includes('Đã giao')) repairs++; });
        cashflow.forEach(c => { if(c.date === target && (c.type === 'chi' || c.type === 'chi_ncc')) expenses += c.amount; });

        document.getElementById('dash-cards').innerHTML = `
            <div class="col card dash-card" style="border-left:4px solid var(--primary);" onclick="showDashDetail('sales')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">💰 Doanh Thu Hôm Nay</h4>
                <h2 style="margin:0; color:var(--primary);">${sales.toLocaleString()} đ</h2>
                <div style="font-size:0.85rem; margin-top:8px;">
                    Tiền mặt: <b style="color:var(--success);">${cashSales.toLocaleString()} đ</b><br>
                    Công nợ: <b style="color:var(--warning);">${debtSales.toLocaleString()} đ</b>
                </div>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--success);" onclick="showDashDetail('bills')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">🧾 Số Lượng Bill</h4><h2 style="margin:0; color:var(--success);">${bills}</h2>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--warning);" onclick="showDashDetail('repairs')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">🛠️ Máy Đang Nằm Viện</h4><h2 style="margin:0; color:var(--warning);">${repairs}</h2>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--danger);" onclick="showDashDetail('expenses')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">🔴 Chi Phí Hôm Nay</h4><h2 style="margin:0; color:var(--danger);">${expenses.toLocaleString()} đ</h2>
            </div>
        `;
    }

            transactions.forEach(t => { if(t.date === target && (t.type === 'cash' || t.type === 'debt')) { let c = customers.find(x=>x.id===t.customerId), amt = t.amount + (t.partsRevenue || 0), cname = c ? c.name : 'Khách lẻ'; html += `<tr><td>${t.time||''}</td><td>${t.id}<br><small>${cname}</small></td><td>${t.details}</td><td style="text-align:right; font-weight:bold; color:var(--primary);">${amt.toLocaleString()}</td></tr>`; } });

            transactions.forEach(t => { if(t.date === target) { let c = customers.find(x=>x.id===t.customerId), typ = t.type === 'pay' ? 'Thu Nợ' : 'Bán Hàng'; html += `<tr><td>${t.time||''}</td><td>${typ} (${t.id})</td><td>${c?c.name:'Khách'}</td><td>${t.details}</td></tr>`; } });

            document.getElementById('dd-title').innerText = 'Máy Đang Nằm Viện (Chưa Trả)'; document.getElementById('dd-head').innerHTML = `<tr><th>Mã Số</th><th>Khách Hàng</th><th>Thông Tin Máy</th><th>Trạng Thái</th></tr>`;
            serviceOrders.forEach(o => { if(!o.status.includes('Đã trả') && !o.status.includes('Đã giao')) { let c = customers.find(x=>x.id===o.customerId); html += `<tr><td>${o.id}</td><td>${c?c.name:'Khách'}</td><td><b>${o.model}</b><br><small>${o.condition}</small></td><td><span style="color:var(--warning);">${o.status}</span></td></tr>`; } });

        }
        document.getElementById('dd-body').innerHTML = html || `<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu</td></tr>`; openModal('dashDetailModal');

    function setRpDate(type) {
        let today = getToday();
        let fromEl = document.getElementById('rp-from'), toEl = document.getElementById('rp-to');
        if (type === 'today') {
            fromEl.value = today; toEl.value = today;
        } else if (type === 'this_month') {
            fromEl.value = today.substring(0,8) + '01'; toEl.value = today;
        } else if (type === 'select_month') {
            let m = document.getElementById('rp-month').value; 
            if (m) {
                fromEl.value = m + '-01';
                let year = parseInt(m.split('-')[0]), month = parseInt(m.split('-')[1]);
                let lastDay = new Date(year, month, 0).getDate();
                toEl.value = m + '-' + lastDay.toString().padStart(2, '0');
            }
        }
        genReport(); 
    }

    function genReport() {
        let from = document.getElementById('rp-from').value, to = document.getElementById('rp-to').value;
        if(!from || !to) return uiAlert("Chọn đủ từ ngày - đến ngày");
        let rev = 0, cost = 0, srv = 0, inOther = 0, outOther = 0, staffStats = {};
        transactions.forEach(t => {
            if(t.date >= from && t.date <= to && (t.type==='cash' || t.type==='debt')) {
                let isSrv = t.note && t.note.includes('Từ phiếu'), amt = t.amount + (t.partsRevenue || 0);
                if(isSrv) { srv += t.amount; rev += (t.partsRevenue||0); cost += t.totalCost||0; } else { rev += amt; cost += t.totalCost||0; }
                let s = t.staffId || 'ADMIN'; if(!staffStats[s]) staffStats[s] = {r:0, c:0}; staffStats[s].r += amt; staffStats[s].c += (t.totalCost||0);
            }
        });
        // SỔ NỢ: Không cộng phần vay_muon hoặc tra_no vào Lợi nhuận
        cashflow.forEach(c => { 
            if(c.date >= from && c.date <= to) { 
                if(c.type === 'thu') inOther += c.amount; 
                else if(c.type === 'chi' || c.type === 'chi_ncc') outOther += c.amount; 
            } 
        });
        let totalProfit = (rev - cost) + srv + inOther - outOther;
        
        document.getElementById('rp-cards').innerHTML = `
            <div class="col card dash-card" style="border-left:4px solid var(--primary);" onclick="showReportDetail('rev')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Tiền Bán Máy/LK (+)</h4><h3 style="margin:0; color:var(--primary);">${rev.toLocaleString()} đ</h3>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--warning);" onclick="showReportDetail('cost')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Vốn Hàng Bán (-)</h4><h3 style="margin:0; color:var(--warning);">${cost.toLocaleString()} đ</h3>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--success);" onclick="showReportDetail('srv')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Công Sửa Chữa (+)</h4><h3 style="margin:0; color:var(--success);">${srv.toLocaleString()} đ</h3>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--info);" onclick="showReportDetail('in')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Thu Khác (+)</h4><h3 style="margin:0; color:var(--info);">${inOther.toLocaleString()} đ</h3>
            </div>
            <div class="col card dash-card" style="border-left:4px solid var(--danger);" onclick="showReportDetail('out')">
                <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Chi Phí (-)</h4><h3 style="margin:0; color:var(--danger);">${outOther.toLocaleString()} đ</h3>
            </div>
            <div class="col card" style="border-top:4px solid #000; width:100%; text-align:center; background:#f8fafc;">
                <h3 style="margin:0 0 10px 0; color:var(--text-muted);">TỔNG LỢI NHUẬN THỰC</h3><h1 style="margin:0; color:${totalProfit>=0?'var(--success)':'var(--danger)'};">${totalProfit.toLocaleString()} đ</h1>
            </div>
        `;
        let stHtml = '';
        for(let k in staffStats) { let st = staffs.find(x=>x.id===k), sr = staffStats[k].r, sc = staffStats[k].c; stHtml += `<tr><td><b>${st?st.name:k}</b></td><td style="text-align:right;">${sr.toLocaleString()}</td><td style="text-align:right;">${sc.toLocaleString()}</td><td style="text-align:right; font-weight:bold; color:var(--success);">${(sr-sc).toLocaleString()}</td></tr>`; }
        document.getElementById('rp-staff-tbl').innerHTML = stHtml || `<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu</td></tr>`;
    }
    
    function showReportDetail(type) {
        let from = document.getElementById('rp-from').value, to = document.getElementById('rp-to').value, html = '';
        document.getElementById('dd-head').innerHTML = `<tr><th>Ngày</th><th>Mã Giao Dịch</th><th>Nội Dung</th><th style="text-align:right;">Số Tiền</th></tr>`;
        if(type === 'rev') { document.getElementById('dd-title').innerText = 'Chi Tiết Doanh Thu'; transactions.forEach(t => { if(t.date >= from && t.date <= to && (t.type==='cash' || t.type==='debt')) { let isSrv = t.note && t.note.includes('Từ phiếu'); if(!isSrv) html += `<tr><td>${formatD(t.date)}</td><td>${t.id}</td><td>${t.details}</td><td style="text-align:right; font-weight:bold; color:var(--primary);">${(t.amount + (t.partsRevenue || 0)).toLocaleString()}</td></tr>`; } }); }
        else if (type === 'cost') { document.getElementById('dd-title').innerText = 'Chi Tiết Giá Vốn Hàng Bán'; transactions.forEach(t => { if(t.date >= from && t.date <= to && (t.type==='cash' || t.type==='debt') && t.totalCost > 0) html += `<tr><td>${formatD(t.date)}</td><td>${t.id}</td><td>${t.details}</td><td style="text-align:right; font-weight:bold; color:var(--warning);">${t.totalCost.toLocaleString()}</td></tr>`; }); }
        else if (type === 'srv') { document.getElementById('dd-title').innerText = 'Chi Tiết Tiền Công Sửa Chữa'; transactions.forEach(t => { if(t.date >= from && t.date <= to && (t.type==='cash' || t.type==='debt')) { let isSrv = t.note && t.note.includes('Từ phiếu'); if(isSrv && t.amount > 0) html += `<tr><td>${formatD(t.date)}</td><td>${t.id}</td><td>${t.details}</td><td style="text-align:right; font-weight:bold; color:var(--success);">${t.amount.toLocaleString()}</td></tr>`; } }); }
        else if (type === 'in') { document.getElementById('dd-title').innerText = 'Chi Tiết Thu Khác'; cashflow.forEach(c => { if(c.date >= from && c.date <= to && c.type === 'thu') html += `<tr><td>${formatD(c.date)}</td><td>${c.id}</td><td>${c.reason}</td><td style="text-align:right; font-weight:bold; color:var(--success);">${c.amount.toLocaleString()}</td></tr>`; }); }
        else if (type === 'out') { document.getElementById('dd-title').innerText = 'Chi Phí Khác'; cashflow.forEach(c => { if(c.date >= from && c.date <= to && (c.type === 'chi' || c.type === 'chi_ncc')) html += `<tr><td>${formatD(c.date)}</td><td>${c.id}</td><td>${c.reason}</td><td style="text-align:right; font-weight:bold; color:var(--danger);">${c.amount.toLocaleString()}</td></tr>`; }); }
        document.getElementById('dd-body').innerHTML = html || `<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu</td></tr>`; openModal('dashDetailModal');
    }

    /* ---------------- SETTINGS & DỮ LIỆU CƠ SỞ ---------------- */
    function saveStoreInfo() { storeInfo.name = document.getElementById('cfg-name').value.trim() || 'LƯƠNG GIA KG'; storeInfo.address = document.getElementById('cfg-addr').value.trim(); storeInfo.phone = document.getElementById('cfg-phone').value.trim(); storeInfo.logoUrl = document.getElementById('cfg-logo').value.trim(); pushDB(); uiAlert('✅ Đã lưu thông tin cửa hàng!'); }
    function exportData() { let data = { staffs, inventory, customers, suppliers, transactions, serviceOrders, importReceipts, cashflow, recycleBin, activityLogs, storeInfo }; let blob = new Blob([JSON.stringify(data)], {type: "application/json"}); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = `LuongGia_Backup_${getToday()}.json`; a.click(); }
    function restoreDataFromPC(e) { let file = e.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(evt) { try { let d = JSON.parse(evt.target.result); if(d.inventory) { db.ref().set(d).then(() => { uiAlert('✅ Đã phục hồi dữ liệu thành công!'); setTimeout(()=>location.reload(), 2000); }); } else uiAlert('File backup không đúng định dạng!'); } catch(err) { uiAlert('Lỗi đọc file!'); } }; reader.readAsText(file); }
    function getCusDebt(cId) { let n = 0; transactions.forEach(t => { if(t.customerId === cId) { if(t.type === 'debt') n += (t.amount + (t.partsRevenue||0)); else if(t.type === 'pay') n -= t.amount; } }); return n; }
    function getSupDebt(sId) { let n = 0; importReceipts.forEach(r => { if(r.supId === sId) n += (r.total - (r.paid||0)); }); cashflow.forEach(c => { if(c.type === 'chi_ncc' && c.supId === sId) n -= c.amount; }); return n; }
    function updateStaffField(id, field, val) { let s = staffs.find(x=>x.id===id); if(s) { s[field]=val.trim(); pushDB(); uiAlert('Đã cập nhật nhân viên!'); } }

    /* ---------------- RENDER ALL BẢNG ---------------- */
    function renderData() {
        if(isBoss()) {
            if(document.getElementById('dash-date')) renderDashboard();
            document.getElementById('cfg-name').value = storeInfo.name || ''; document.getElementById('cfg-addr').value = storeInfo.address || ''; document.getElementById('cfg-phone').value = storeInfo.phone || ''; document.getElementById('cfg-logo').value = storeInfo.logoUrl || '';
            
            let cusList = customers.map(c => ({...c, debt: getCusDebt(c.id)})).sort((a,b) => b.debt - a.debt);
            document.getElementById('cus-tbl').innerHTML = cusList.map(c=>`<tr><td><b>${c.name}</b> ${c.isMonthlyDebt ? '<span title="Khách nợ tháng" style="color:var(--success);">📅</span>' : ''}<br><small>${c.phone}</small></td><td><b style="color:${c.debt>0?'var(--danger)':'var(--text-main)'};">${c.debt.toLocaleString()} đ</b></td><td><div style="display:flex; gap:5px;"><button class="btn btn-outline" style="padding:4px 8px;" onclick="openEditCus('${c.id}')">✏️</button><button class="btn btn-info" style="padding:4px 8px; font-size:0.8rem;" onclick="openStatement('${c.id}', '${c.name}')">📝 Bảng Kê</button><button class="btn btn-success" style="padding:4px 8px; font-size:0.8rem;" onclick="openDebtModal('${c.id}', '${c.name}', ${c.debt})">💵 Thu</button></div></td></tr>`).join('');
            
            let supList = suppliers.map(s => ({...s, debt: getSupDebt(s.id)})).sort((a,b) => b.debt - a.debt);
            document.getElementById('sup-tbl').innerHTML = supList.map(s=>`<tr><td><b>${s.name}</b><br><small>${s.phone}</small></td><td><b style="color:var(--danger);">${s.debt.toLocaleString()} đ</b></td><td><div style="display:flex; gap:5px;"><button class="btn btn-outline" style="padding:4px 8px;" onclick="openEditSup('${s.id}')">✏️</button>${s.debt > 0 ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="openPaySupModal('${s.id}', '${s.name}', ${s.debt})">🔴 Trả Nợ</button>` : ''}</div></td></tr>`).join('');
            
            document.getElementById('staff-table').innerHTML = staffs.map(s => `<tr><td><b>${s.id}</b></td><td><input type="text" class="form-control" style="padding:8px;" value="${s.name}" onchange="updateStaffField('${s.id}', 'name', this.value)"></td><td><input type="text" class="form-control" style="padding:8px; color:var(--danger);" value="${s.password || s.pass}" onchange="updateStaffField('${s.id}', 'password', this.value)"></td></tr>`).join('');
            document.getElementById('recycle-bin-table').innerHTML = recycleBin.slice().reverse().map(rb => `<tr><td style="font-size:0.8rem;">${rb.deletedAt}</td><td><span class="badge" style="background:#f1f5f9; color:var(--text-muted);">${rb.type}</span></td><td><b style="font-size:0.85rem;">${rb.label}</b></td><td><button class="btn btn-info" style="padding:4px 8px; font-size:0.8rem; background:var(--info); color:#fff;" onclick="restoreBinItem('${rb.id}')">♻️ Khôi Phục</button></td></tr>`).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:20px;">Thùng rác sạch sẽ ✨</td></tr>`;
        }

        let isAdmin = isBoss();
        document.getElementById('inv-tbl').innerHTML = inventory.map(i=>`
            <tr>
                <td><b>${i.name}</b></td>
                ${isAdmin ? `<td><span style="color:var(--warning); font-weight:bold;">${(i.cost||0).toLocaleString()}đ</span></td>` : ''}
                <td><span style="color:var(--primary); font-weight:bold;">${i.price.toLocaleString()}đ</span></td>
                <td style="text-align:center;"><span style="font-weight:bold; font-size:1.1rem; ${i.minStock>0 && i.stock<=i.minStock ? 'color:var(--danger);' : ''}">${i.stock !== undefined ? i.stock : 0}</span></td>
                <td style="text-align:center;"><button class="btn btn-icon" style="color:var(--primary); margin:0 auto;" onclick="openEditProd('${i.id}')">✏️</button></td>
            </tr>
        `).join('');
        
        let activeSrv = [], doneSrv = [];
        serviceOrders.slice().forEach(o => { if(o.status.includes('Đã trả') || o.status.includes('Đã giao')) doneSrv.push(o); else activeSrv.push(o); });
        doneSrv.sort((a, b) => ((b.receiveDate||'')+(b.receiveTime||'')).localeCompare((a.receiveDate||'')+(a.receiveTime||'')));
        
        let mapSrv = (o, isDone) => { 
            let c=customers.find(x=>x.id===o.customerId); 
            let statHtml = isDone ? `<span class="badge" style="background:#f4f6f8; color:${o.status==='Đã trả khách'?'var(--success)':'var(--text-muted)'};">${o.status}</span>` : `<select style="width:100%; padding:6px; border-radius:6px; border:1px solid #ccc; font-size:0.85rem;" onchange="changeSrvStatus('${o.id}', this.value, this)"><option value="${o.status}" selected disabled>${o.status}</option><option value="Đang sửa">Đang sửa</option><option value="Chờ linh kiện">Chờ LK</option><option value="Chờ khách lấy">Chờ khách lấy</option><option value="Không sửa được (Chờ trả)">Không sửa được (Chờ trả)</option><option value="Không sửa được (Đã trả)">Đã trả (Không sửa được)</option><option value="Đã trả khách">Đã giao (Thu tiền)</option></select>`; 
            return `<tr>
                <td><b>${c?c.name:'Khách'}</b><br><small>${c?c.phone:''}</small></td>
                <td><b style="color:var(--primary);">${o.model}</b><br><small style="color:var(--text-muted);">${o.condition}</small></td>
                <td>${statHtml}</td>
                <td style="text-align:center;"><button class="btn btn-icon" style="color:var(--primary); margin:0 auto;" onclick="openSrvAction('${o.id}', ${isDone})">✏️</button></td>
            </tr>`; 
        };
        document.getElementById('srv-tbl-active').innerHTML = activeSrv.map(o => mapSrv(o, false)).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Không có máy đang nằm viện</td></tr>`;
        document.getElementById('srv-tbl-done').innerHTML = doneSrv.map(o => mapSrv(o, true)).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Trống</td></tr>`;

        renderHistoryTable();

        let cbFrom = isBoss() ? document.getElementById('cb-from').value : document.getElementById('cb-staff-date').value;
        let cbTo = isBoss() ? document.getElementById('cb-to').value : document.getElementById('cb-staff-date').value;
        if(!cbFrom) cbFrom = getToday(); if(!cbTo) cbTo = getToday();
        
        let netStart = 0, inC = 0, outC = 0, cbArrIn = [], cbArrOut = [];
        transactions.forEach(t=>{ 
            let amt = t.amount + (t.partsRevenue||0);
            if(t.type==='cash' || t.type==='pay') { 
                if(t.date < cbFrom) { netStart += amt; } 
                else if(t.date >= cbFrom && t.date <= cbTo) { 
                    inC += amt; let sName = staffs.find(x=>x.id===t.staffId)?.name || '';
                    cbArrIn.push({dt: `${formatD(t.date)}<br>${t.time||''}`, t: t.date+(t.time||''), note:`${t.type==='cash'?'Bán hàng':'Thu nợ'}: ${t.details}`, amt, id:t.id, isTx:true, staff: sName}); 
                } 
            } 
        });
        
        cashflow.forEach(c=>{ 
            let canDelete = (isBoss() || c.staffId === activeUser); 
            let sName = staffs.find(x=>x.id===c.staffId)?.name || '';
            if(c.type==='thu' || c.type==='vay_muon') { 
                if(c.date < cbFrom) { netStart += c.amount; } 
                else if(c.date >= cbFrom && c.date <= cbTo) { 
                    inC += c.amount; 
                    cbArrIn.push({dt: `${formatD(c.date)}<br>${c.time||''}`, t: c.date+(c.time||''), note:c.reason, amt:c.amount, id:c.id, isTx:false, canDel: canDelete, staff: sName}); 
                } 
            } else if (c.type==='chi' || c.type==='chi_ncc' || c.type==='tra_no') { 
                if(c.date < cbFrom) { netStart -= c.amount; } 
                else if(c.date >= cbFrom && c.date <= cbTo) { 
                    outC += c.amount; 
                    cbArrOut.push({dt: `${formatD(c.date)}<br>${c.time||''}`, t: c.date+(c.time||''), note:c.reason, amt:c.amount, id:c.id, isTx:false, canDel: canDelete, staff: sName}); 
                } 
            }
        });
        
        if(isBoss()) setTxt('cb-net', netStart + inC - outC);
        
        let inHtml = cbArrIn.sort((a,b)=>b.t.localeCompare(a.t)).map(c=>`<tr><td><small>${c.dt}</small></td>${isBoss()?`<td>${c.staff}</td>`:''}<td>${c.note}</td><td style="text-align:right; font-weight:bold; color:var(--success);">+${c.amt.toLocaleString()}đ</td><td>${!c.isTx && c.canDel ? `<button class="btn btn-outline" style="padding:4px 8px; color:var(--danger); border:none;" onclick="deleteItemToBin('${c.id}', 'Sổ Quỹ', cashflow, x => x.reason)">🗑️</button>` : ''}</td></tr>`).join('');
        document.getElementById('cb-tbl-in').innerHTML = inHtml || `<tr><td colspan="${isBoss()?5:4}" style="text-align:center; color:var(--text-muted);">Không có phiếu thu</td></tr>`;
        let outHtml = cbArrOut.sort((a,b)=>b.t.localeCompare(a.t)).map(c=>`<tr><td><small>${c.dt}</small></td>${isBoss()?`<td>${c.staff}</td>`:''}<td>${c.note}</td><td style="text-align:right; font-weight:bold; color:var(--danger);">-${c.amt.toLocaleString()}đ</td><td>${!c.isTx && c.canDel ? `<button class="btn btn-outline" style="padding:4px 8px; color:var(--danger); border:none;" onclick="deleteItemToBin('${c.id}', 'Sổ Quỹ', cashflow, x => x.reason)">🗑️</button>` : ''}</td></tr>`).join('');
        document.getElementById('cb-tbl-out').innerHTML = outHtml || `<tr><td colspan="${isBoss()?5:4}" style="text-align:center; color:var(--text-muted);">Không có phiếu chi</td></tr>`;
    }

    function renderHistoryTable() {
        let exactCusId = document.getElementById('hist-exact-cusid').value;
        let histSales = [], histPay = [];
        
        transactions.slice().reverse().forEach(t => {
            if(exactCusId && t.customerId !== exactCusId) return;
            let c=customers.find(x=>x.id===t.customerId);
            
            if(t.type === 'pay') {
                histPay.push(`<tr data-cusid="${t.customerId}">
                    <td><small style="color:var(--text-muted);">${formatD(t.date)}<br>${t.time||''}</small></td>
                    <td><b>${c?c.name:'Khách'}</b></td>
                    <td style="text-align:right;"><b style="color:var(--success); font-size:1.1rem;">${t.amount.toLocaleString()}đ</b></td>
                    <td style="text-align:center;"><button class="btn btn-icon" style="color:var(--primary); margin:0 auto;" onclick="openHistAction('${t.id}', 'pay')">✏️</button></td>
                </tr>`);
            } else {
                let typ = t.type==='cash' ? '<span class="badge" style="background:#e0f2fe; color:#0284c7;">Tiền mặt</span>' : '<span class="badge" style="background:#ffedd5; color:#ea580c;">Bán nợ</span>';
                histSales.push(`<tr data-cusid="${t.customerId}">
                    <td><small style="color:var(--text-muted);">${formatD(t.date)}<br>${t.time||''}</small></td>
                    <td><b>${c?c.name:'Khách'}</b><br>${typ}</td>
                    <td>
                        <div style="line-height:1.4;">${t.details}</div>
                        ${t.note ? `<div style="margin-top:4px; font-size:0.85rem; color:var(--danger); font-style:italic;">*Ghi chú: ${t.note}</div>` : ''}
                    </td>
                    <td style="text-align:right;"><b style="color:var(--primary); font-size:1.1rem;">${(t.amount+(t.partsRevenue||0)).toLocaleString()}đ</b></td>
                    <td style="text-align:center;"><button class="btn btn-icon" style="color:var(--primary); margin:0 auto;" onclick="openHistAction('${t.id}', 'sales')">✏️</button></td>
                </tr>`);
            }
        });
        document.getElementById('hist-tbl-sales').innerHTML = histSales.join('') || `<tr><td colspan="5" style="text-align:center;">Trống</td></tr>`;
        document.getElementById('hist-tbl-pay').innerHTML = histPay.join('') || `<tr><td colspan="4" style="text-align:center;">Trống</td></tr>`;
        
        if(!exactCusId) {
            let val = document.getElementById('hist-search-input').value.toLowerCase();
            if(val) { filterTable('hist-tbl-sales', val); filterTable('hist-tbl-pay', val); }
        }
    }

    // IN ẤN
    function printStatement() { 
        let cId = document.getElementById('stmt-cus-id').value, cName = document.getElementById('stmt-cus-name').innerText;
        let from = document.getElementById('stmt-from').value, to = document.getElementById('stmt-to').value;
        let phone = customers.find(x => x.id === cId)?.phone || '';
        let noCu = 0, phatSinh = 0, daTra = 0, rowsHtml = '', stt = 1;

        transactions.forEach(t => {
            if(t.customerId === cId) {
                if(t.date < from) {
                    if(t.type === 'debt') noCu += (t.amount + (t.partsRevenue||0)); else if(t.type === 'pay') noCu -= t.amount;
                } else if (t.date >= from && t.date <= to) {
                    let extraNote = (t.note && !t.details.includes(t.note)) ? `<br><i style="font-size:12px; color:#555;">(${t.note})</i>` : '';
                    if (t.type === 'debt') {
                        let amt = t.amount + (t.partsRevenue || 0); phatSinh += amt;
                        rowsHtml += `<tr><td style="border:1px solid #000; padding:8px; text-align:center;">${stt++}</td><td style="border:1px solid #000; padding:8px; text-align:center;">${formatD(t.date)}</td><td style="border:1px solid #000; padding:8px; text-align:center;">${t.id}</td><td style="border:1px solid #000; padding:8px;">${t.details}${extraNote}</td><td style="border:1px solid #000; padding:8px; text-align:right;">${amt.toLocaleString()}</td><td style="border:1px solid #000; padding:8px; text-align:center;">-</td></tr>`;
                    } else if (t.type === 'pay') {
                        daTra += t.amount;
                        rowsHtml += `<tr><td style="border:1px solid #000; padding:8px; text-align:center;">${stt++}</td><td style="border:1px solid #000; padding:8px; text-align:center;">${formatD(t.date)}</td><td style="border:1px solid #000; padding:8px; text-align:center;">${t.id}</td><td style="border:1px solid #000; padding:8px;">Thanh toán nợ: ${t.details}</td><td style="border:1px solid #000; padding:8px; text-align:center;">-</td><td style="border:1px solid #000; padding:8px; text-align:right;">${t.amount.toLocaleString()}</td></tr>`;
                    }
                }
            }
        });

        let noCuoi = noCu + phatSinh - daTra;
        let logoHtml = storeInfo.logoUrl ? `<img src="${storeInfo.logoUrl}" style="max-height:80px; max-width:200px; object-fit:contain;">` : '';
        let h = `
        <div style="width:100%; max-width:210mm; padding: 10px 0; margin:0 auto; font-family:'Times New Roman', serif; color:#000; line-height:1.5; background:#fff;">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:15px; margin-bottom:20px;">
                <div style="width:40%; text-align:left;">${logoHtml}</div><div style="width:60%; text-align:right;"><h2 style="margin:0; font-size:20px; text-transform:uppercase;">${storeInfo.name}</h2><p style="margin:5px 0 0 0; font-size:14px;">ĐC: ${storeInfo.address}<br>ĐT: ${storeInfo.phone}</p></div>
            </div>
            <h1 style="text-align:center; font-size:24px; margin:20px 0 5px 0;">BẢNG KÊ CHI TIẾT CÔNG NỢ</h1>
            <p style="text-align:center; font-style:italic; margin:0 0 25px 0;">(Từ ngày ${formatD(from)} đến ngày ${formatD(to)})</p>
            <div style="margin-bottom:20px; font-size:15px;"><p style="margin:5px 0;"><b>Khách hàng:</b> ${cName}</p><p style="margin:5px 0;"><b>Điện thoại:</b> ${phone}</p></div>
            <div style="text-align:right; font-style:italic; font-size:13px; margin-bottom:5px;">Đơn vị tính: VNĐ</div>
            <table style="width:100%; border-collapse:collapse; font-size:14px; margin-bottom:25px;">
                <thead><tr style="background-color:#f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;"><th style="border:1px solid #000; padding:10px; width:6%;">STT</th><th style="border:1px solid #000; padding:10px; width:12%;">Ngày</th><th style="border:1px solid #000; padding:10px; width:15%;">Chứng từ</th><th style="border:1px solid #000; padding:10px; width:33%;">Diễn giải</th><th style="border:1px solid #000; padding:10px; width:17%;">Phát sinh (Nợ)</th><th style="border:1px solid #000; padding:10px; width:17%;">Thanh toán (Có)</th></tr></thead>
                <tbody>
                    <tr><td colspan="4" style="border:1px solid #000; padding:8px; font-weight:bold; text-align:right;">Số dư nợ đầu kỳ:</td><td style="border:1px solid #000; padding:8px; font-weight:bold; text-align:right;">${noCu > 0 ? noCu.toLocaleString() : '-'}</td><td style="border:1px solid #000; padding:8px; text-align:center;">-</td></tr>
                    ${rowsHtml || `<tr><td colspan="6" style="border:1px solid #000; padding:10px; text-align:center; font-style:italic;">Không có phát sinh trong kỳ</td></tr>`}
                    <tr><td colspan="4" style="border:1px solid #000; padding:8px; font-weight:bold; text-align:right;">Cộng phát sinh trong kỳ:</td><td style="border:1px solid #000; padding:8px; font-weight:bold; text-align:right;">${phatSinh > 0 ? phatSinh.toLocaleString() : '-'}</td><td style="border:1px solid #000; padding:8px; font-weight:bold; text-align:right;">${daTra > 0 ? daTra.toLocaleString() : '-'}</td></tr>
                    <tr><td colspan="4" style="border:1px solid #000; padding:10px; font-weight:bold; text-align:right; font-size:16px;">SỐ DƯ NỢ CUỐI KỲ (KHÁCH CÒN NỢ):</td><td colspan="2" style="border:1px solid #000; padding:10px; font-weight:bold; text-align:center; font-size:18px; color:red !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;">${noCuoi.toLocaleString()}</td></tr>
                </tbody>
            </table>
            <div style="display:flex; justify-content:space-between; margin-top:30px; font-size:15px; text-align:center;"><div style="width:40%;"><b>Người mua hàng</b><br><i style="font-size:13px;">(Ký, ghi rõ họ tên)</i></div><div style="width:40%;"><b>Đại diện cửa hàng</b><br><i style="font-size:13px;">(Ký, ghi rõ họ tên)</i></div></div>
        </div>
        `;
        document.getElementById('preview-content').innerHTML = h; document.getElementById('print-area').innerHTML = h; openModal('previewModal');
    }

    function printBill(id, type) {
        let h = '', logoHtml = storeInfo.logoUrl ? `<img src="${storeInfo.logoUrl}" style="max-width:120px; max-height:60px; object-fit:contain; margin:0 auto 5px auto; display:block;">` : '';
        if(type==='sales') {
            let t = transactions.find(x=>x.id===id); if(!t) return;
            let c = customers.find(x=>x.id===t.customerId) || {name:'Khách lẻ', phone:''}, trs = ''; 
            if(t.itemsRaw && t.itemsRaw.length > 0) { t.itemsRaw.forEach(i=>trs+=`<tr><td style="padding:6px 0; border-bottom:1px dashed #ccc;"><b>${i.name}</b><br><small>${i.qty} x ${i.price.toLocaleString()}</small></td><td style="text-align:right; font-weight:bold; vertical-align:bottom; padding:6px 0; border-bottom:1px dashed #ccc;">${(i.qty*i.price).toLocaleString()}</td></tr>`); } 
            else { trs=`<tr><td style="padding:6px 0; border-bottom:1px dashed #ccc;">${t.details}</td><td style="text-align:right; font-weight:bold; vertical-align:bottom; padding:6px 0; border-bottom:1px dashed #ccc;">${(t.amount+(t.partsRevenue||0)).toLocaleString()}</td></tr>`; }
            h = `<div style="width:78mm; margin:0 auto; font-family:sans-serif; color:#000; text-align:left; background:#fff;"><div style="text-align:center;">${logoHtml}<h2 style="margin:0; font-size:18px;">${storeInfo.name}</h2><p style="margin:5px 0; font-size:12px;">ĐC: ${storeInfo.address}<br>ĐT: ${storeInfo.phone}</p></div><h3 style="text-align:center; background:#000 !important; color:#fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding:6px; margin:15px 0 10px 0; font-size:14px; border-radius:4px;">${t.type==='pay'?'PHIẾU THU NỢ':'HÓA ĐƠN BÁN HÀNG'}</h3><div style="font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between;"><div>Số: <b>${t.id}</b></div><div>Ngày: <b>${formatD(t.date)} ${t.time||''}</b></div></div><div style="font-size:13px; margin-bottom:10px;">Khách hàng: <b>${c.name}</b></div><table style="width:100%; font-size:13px; border-collapse:collapse; margin-bottom:10px;"><thead><tr style="border-bottom:2px solid #000;"><th style="text-align:left; padding-bottom:5px;">${t.type==='pay'?'Chi tiết':'Mặt hàng'}</th><th style="text-align:right; padding-bottom:5px;">Thành tiền</th></tr></thead><tbody>${trs}</tbody></table><div style="text-align:right; font-size:16px; margin:15px 0; font-weight:bold;">TỔNG CỘNG: ${(t.amount+(t.partsRevenue||0)).toLocaleString()} đ</div><div style="text-align:center; font-size:12px; font-style:italic; border-top:1px dashed #000; padding-top:10px;">Cảm ơn quý khách đã ủng hộ!</div></div>`;
        } else if(type==='service') {
            let o = serviceOrders.find(x=>x.id===id); if(!o) return;
            let c = customers.find(x=>x.id===o.customerId) || {name:'Khách', phone:''};
            h = `<div style="width:78mm; margin:0 auto; font-family:sans-serif; color:#000; text-align:left; background:#fff;"><div style="text-align:center;">${logoHtml}<h2 style="margin:0; font-size:18px;">${storeInfo.name}</h2><p style="margin:5px 0; font-size:12px;">ĐC: ${storeInfo.address}<br>ĐT: ${storeInfo.phone}</p></div><h3 style="text-align:center; background:#000 !important; color:#fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding:6px; margin:15px 0 10px 0; font-size:14px; border-radius:4px;">BIÊN NHẬN SỬA MÁY</h3><div style="font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between;"><div>Mã: <b>${o.id}</b></div><div>Ngày: <b>${formatD(o.receiveDate)}</b></div></div><div style="font-size:13px; margin-bottom:10px;">Khách hàng: <b>${c.name}</b> - SĐT: ${c.phone||'...'}</div><div style="border:1px solid #000; border-radius:6px; padding:10px; margin:15px 0; font-size:13px;"><div style="margin-bottom:6px;"><b>Tên Máy:</b> ${o.model}</div><div style="margin-bottom:6px;"><b>Tình trạng (Lỗi):</b><br>${o.condition}</div><div style="border-top:1px dashed #ccc; margin-top:8px; padding-top:8px;"><b>Báo giá dự kiến:</b> <span style="font-size:15px; font-weight:bold;">${o.quote.toLocaleString()} đ</span></div></div><div style="text-align:center; font-size:12px; font-weight:bold; margin-top:15px;">Lưu ý: Quý khách vui lòng giữ kỹ biên nhận để đối chiếu khi lấy máy!</div></div>`;
        }
        document.getElementById('preview-content').innerHTML = h; document.getElementById('print-area').innerHTML = h; openModal('previewModal');
    }

    function executePrint() { closeModal('previewModal'); setTimeout(() => { document.body.classList.add('is-printing'); window.print(); document.body.classList.remove('is-printing'); }, 300); }
</script>

<style> 
    @media print { 
        body.is-printing > :not(#print-area) { display: none !important; } 
        #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; } 
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } 
        @page { margin: 0; } 
    } 
</style>
</body>
</html>
